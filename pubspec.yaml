name: justbus
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_auth: ^4.17.0
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true

  image_path: "assets/icon/justbus_foreground.png"


  adaptive_icon_background: "assets/icon/justbus_background.png"
  adaptive_icon_foreground: "assets/icon/justbus_foreground.png"

