name: justbus
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  permission_handler: ^11.3.1  
  intl: ^0.18.1
  qr_flutter: ^4.1.0
  flutter_map: ^6.1.0
  http: ^1.2.0
  google_maps_flutter: ^2.6.0
  shared_preferences: ^2.2.2
  mobile_scanner: ^5.1.1
  geolocator: ^11.0.0
  latlong2: ^0.9.1
  flutter_svg: ^2.0.10+1
  vector_graphics: ^1.1.11
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^17.2.2
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatars/

flutter_icons:
  android: true
  ios: true

  image_path: "assets/icon/justbus_foreground.png"
  adaptive_icon_background: "assets/icon/justbus_background.png"
  adaptive_icon_foreground: "assets/icon/justbus_foreground.png"



